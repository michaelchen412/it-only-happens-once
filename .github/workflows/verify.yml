# The belt. Vercel is the braces.
#
# ⚠ READ docs/architecture.md §9a BEFORE CHANGING THIS FILE. That section argues
# — correctly, and this workflow does not weaken it — that a GitHub Action must
# NOT be the gate: an Action reports a breakage while the broken version is
# already live, whereas `npm run build` runs `verify` first and Vercel's build
# command is `npm run build`, so a red check fails the BUILD and the last good
# deployment keeps serving. That is the difference between a tripwire and a
# gate, and the gate stays in package.json where it is.
#
# What this adds is the two things that fall through anyway:
#
#   1. A ✓ or ✗ on the commit. The gate stops a bad deploy but leaves no mark
#      on the history; a reviewer looking at this repo sees nothing either way.
#   2. A scheduled `npm audit`. Plan 31 §1 found seven advisories, none of them
#      reachable, and five were `astro-icon`'s transitive tail — which is not
#      maintained on this repo's schedule and will regrow. A schedule is how you
#      find that out without remembering to look.
#
# ⚠ THE E2E SUITE IS DELIBERATELY NOT HERE. It needs SUPABASE_SERVICE_ROLE_KEY
# to mint an admin session, and putting that key in GitHub Actions secrets would
# widen where the service-role key lives — for a single-user personal site, to
# buy something a local run already provides. Same trade as plan 31 §4's refusal
# of database branching, in a different costume. If that ever changes, it is a
# decision to write down, not a convenience to reach for.
name: verify

on:
  push:
    branches: [main]
  # Added 2026-08-10 (plan 34 · §7) FOR DEPENDABOT, which is the only thing that
  # opens a pull request here — CLAUDE.md's rule is to commit straight to `main`.
  # Without this trigger a bump PR arrived with no checks at all.
  #
  # ⚠ No double runs: `push` above is restricted to `main`, and Dependabot's
  # branches are not `main`.
  pull_request:
  schedule:
    # Mondays, 07:00 UTC. The audit job only.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Skipped on the schedule: re-running the same commit's checks weekly proves
    # nothing. The audit below is the job that wants a calendar.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches `engines.node` in package.json.
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      # format:check + lint + astro check + test — ~22s locally.
      #
      # ⚠ NOT `npm run build`. The build additionally runs `astro build` and
      # `check-server-bundle.mjs`, and the bundle check is only meaningful
      # against the artifact VERCEL produces — running it here would either
      # duplicate the deploy or, worse, pass against a differently-built bundle
      # and read as coverage it isn't. Vercel owns that half.
      #
      # ⚠ THAT ARGUMENT IS ABOUT `push`, AND THE `build` JOB BELOW IS ITS
      # EXCEPTION rather than its contradiction. On a push to `main` Vercel
      # really does build the artifact, so a second build here is duplication.
      # On a PULL REQUEST it does not, so nothing owns that half — and a
      # dependency bump is exactly the change that half exists to catch.
      - run: npm run verify

  build:
    # ── The check that a DEPENDENCY BUMP actually needs (plan 34 · §7) ────────
    #
    # ⚠ `npm run verify` IS NOT THAT CHECK, and this job exists because the
    # difference has already cost a production outage. On 2026-07-31 every
    # request 500'd with `Cannot find module 'htmlparser2'` — while typecheck,
    # lint, the whole unit suite and `astro preview` were green. The cause is
    # `astro.config.mjs`'s `noExternal` list, which hardcodes the dependency
    # CLOSURE of `sanitize-html`: bundling a package removes it from the graph
    # Vercel's tracer walks, so it stops being copied into the function, while
    # Rollup leaves any of its own dependencies that aren't also listed as bare
    # `require()` calls pointing at packages no longer shipped.
    #
    # A transitive bump can invalidate that list, and `verify` cannot see it.
    # `scripts/check-server-bundle.mjs` can, and only `npm run build` runs it.
    #
    # PULL REQUESTS ONLY — see the ⚠ on the verify job above.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      # `build`, not `build:unchecked` — the full thing, so the PR is held to
      # exactly what Vercel will run. `verify` runs twice on a PR as a result
      # (once here, once in the job above); it costs ~22s and keeps the two jobs
      # independently readable, which is worth more than the saving.
      #
      # ⚠ NO SECRETS, AND THAT WAS CHECKED RATHER THAN ASSUMED. The first draft
      # of this job passed `PUBLIC_SUPABASE_URL` / `PUBLIC_SUPABASE_ANON_KEY`,
      # on the reasoning that `astro build` evaluates every route module and
      # `lib/supabase.ts` reads both at module scope. It was tested by moving
      # `.env.local` aside and building with the two unset: **it completes**,
      # because a bare `import.meta.env.X` is `undefined` at build time and
      # nothing in a route calls Supabase until a request arrives.
      #
      # So this job needs no repository secrets at all — which is the same
      # answer 31 · §4 reached for the e2e suite, arrived at from the other
      # direction. If a future config change makes the build genuinely need a
      # key, that is a decision to write down, not an `env:` block to paste.
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      # ⚠ `--omit=dev`, because that is the command a reviewer runs, and the
      # number it prints is the one that shapes their first impression. It is
      # not the number that measures risk: plan 31 §1 established that
      # reachability has to be checked against the deployed artifact
      # (.vercel/output/functions/_render.func), and that a bundled dependency
      # can ship while being absent from that folder's node_modules. A red run
      # here is a prompt to redo that reachability work, not proof of exposure.
      - run: npm audit --omit=dev
